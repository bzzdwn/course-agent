services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-agent-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./models:/app/models
    expose:
      - "8000"
    # Порты наружу не нужны — Nginx проксирует
    # Если хотите отлаживать backend напрямую, раскомментируйте:
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: course-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"